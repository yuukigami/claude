    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Hidden file input for import -->
    <input type="file" id="import-file" accept=".json" style="display: none" onchange="handleImportFile(event)">

    <!-- Export One-Pager Options Modal -->
    <div id="export-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="export-modal-title">Export One-Pager</h2>
                <button class="modal-close" onclick="closeExportModal()">&times;</button>
            </div>
            <p style="color: var(--text-secondary); margin-bottom: 16px;">
                Choose what to include in your exported report.
            </p>
            <div class="export-options">
                <label class="export-option">
                    <input type="checkbox" id="export-opt-description" checked>
                    <span>Include tag description</span>
                </label>
                <label class="export-option">
                    <input type="checkbox" id="export-opt-participant" checked>
                    <span>Show participant labels</span>
                </label>
                <label class="export-option">
                    <input type="checkbox" id="export-opt-summary" checked>
                    <span>Include excerpt count summary</span>
                </label>
                <label class="export-option">
                    <input type="checkbox" id="export-opt-source" checked>
                    <span>Show source transcript info</span>
                </label>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeExportModal()">Cancel</button>
                <button class="btn btn-primary" onclick="executeExport()">Export</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // DATABASE (localStorage)
        // ==========================================

        const STORAGE_KEY = 'qualCoderData';

        // Data structure stored in localStorage
        let data = {
            transcripts: [],
            excerpts: [],
            tags: []
        };

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    data = JSON.parse(stored);
                    migrateData();
                } catch (e) {
                    console.error('Failed to parse stored data:', e);
                    data = { transcripts: [], excerpts: [], tags: [] };
                }
            }
        }

        // Migration: Add new fields to existing data
        function migrateData() {
            let needsSave = false;

            // Add description to tags that don't have it
            for (const tag of data.tags) {
                if (tag.description === undefined) {
                    tag.description = '';
                    tag.updatedAt = tag.createdAt || new Date().toISOString();
                    needsSave = true;
                }
            }

            // Add speaker fields to excerpts that don't have them
            for (const excerpt of data.excerpts) {
                if (excerpt.speakerType === undefined) {
                    excerpt.speakerType = 'unknown';
                    excerpt.speakerLabel = '';
                    excerpt.isTaggable = true;
                    needsSave = true;
                }
            }

            // Add parseFormat to transcripts that don't have it
            for (const transcript of data.transcripts) {
                if (transcript.parseFormat === undefined) {
                    transcript.parseFormat = 'raw';
                    needsSave = true;
                }
            }

            if (needsSave) {
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // CRUD operations (synchronous, but kept async-compatible for consistency)
        async function dbAdd(storeName, item) {
            data[storeName].push(item);
            saveData();
            return item;
        }

        async function dbPut(storeName, item) {
            const index = data[storeName].findIndex(i => i.id === item.id);
            if (index !== -1) {
                data[storeName][index] = item;
            } else {
                data[storeName].push(item);
            }
            saveData();
            return item;
        }

        async function dbGet(storeName, id) {
            return data[storeName].find(i => i.id === id);
        }

        async function dbGetAll(storeName) {
            return [...data[storeName]];
        }

        async function dbDelete(storeName, id) {
            data[storeName] = data[storeName].filter(i => i.id !== id);
            saveData();
        }

        async function dbGetByIndex(storeName, indexName, value) {
            return data[storeName].filter(i => i[indexName] === value);
        }

        // ==========================================
        // STATE
        // ==========================================

        let currentTranscript = null;
        let selectedExcerptId = null;
        let pendingConfirmAction = null;
        let mergeMode = false;
        let selectedForMerge = new Set();

        // ==========================================
        // SENTENCE PARSING
        // ==========================================

        function parseSentences(text) {
            // Handle common abbreviations to avoid false splits
            const abbreviations = ['Mr', 'Mrs', 'Ms', 'Dr', 'Prof', 'Sr', 'Jr', 'vs', 'etc', 'i.e', 'e.g'];
            let processed = text;

            // Temporarily replace abbreviations
            abbreviations.forEach((abbr, i) => {
                const regex = new RegExp(`\\b${abbr}\\.`, 'gi');
                processed = processed.replace(regex, `__ABBR${i}__`);
            });

            // Split on sentence-ending punctuation followed by space or newline
            const sentences = processed
                .split(/(?<=[.!?])\s+/)
                .map(s => s.trim())
                .filter(s => s.length > 0);

            // Restore abbreviations
            return sentences.map(sentence => {
                let restored = sentence;
                abbreviations.forEach((abbr, i) => {
                    restored = restored.replace(new RegExp(`__ABBR${i}__`, 'g'), `${abbr}.`);
                });
                return restored;
            });
        }

        // ==========================================
        // SPEAKER DETECTION
        // ==========================================

        const SPEAKER_PATTERNS = {
            task: [
                /^Task\s*\d*[:\s]/i,
                /^\[Task\s*\d*\]/i,
                /^TASK\s*\d*[:\s]/
            ],
            question: [
                /^(Question|Q)\s*\d*[:\s]/i,
                /^\[Q\d*\]/i,
                /^Interviewer[:\s]/i
            ],
            moderator: [
                /^(Moderator|M)[:\s]/i,
                /^Facilitator[:\s]/i,
                /^Researcher[:\s]/i
            ],
            participant: [
                /^(Participant|P|User|U)\s*\d*[:\s]/i,
                /^(Respondent|R)\s*\d*[:\s]/i,
                /^Tester\s*\d*[:\s]/i
            ]
        };

        function detectSpeaker(line) {
            const trimmed = line.trim();
            if (!trimmed) return null;

            for (const [speakerType, patterns] of Object.entries(SPEAKER_PATTERNS)) {
                for (const pattern of patterns) {
                    const match = trimmed.match(pattern);
                    if (match) {
                        const label = match[0].replace(/[:\s]+$/, '').trim();
                        const text = trimmed.slice(match[0].length).trim();
                        return {
                            speakerType,
                            speakerLabel: normalizeLabel(label, speakerType),
                            text: text || trimmed,
                            isTaggable: speakerType === 'participant'
                        };
                    }
                }
            }

            return {
                speakerType: 'unknown',
                speakerLabel: '',
                text: trimmed,
                isTaggable: true
            };
        }

        function normalizeLabel(label, speakerType) {
            // Normalize labels to consistent format
            const upper = label.toUpperCase();

            if (speakerType === 'task') {
                const num = label.match(/\d+/);
                return num ? `Task ${num[0]}` : 'Task';
            }
            if (speakerType === 'question') {
                const num = label.match(/\d+/);
                return num ? `Q${num[0]}` : 'Question';
            }
            if (speakerType === 'participant') {
                const num = label.match(/\d+/);
                return num ? `P${num[0]}` : 'Participant';
            }
            if (speakerType === 'moderator') {
                return 'Moderator';
            }
            return label;
        }

        function parseTranscriptWithSpeakers(rawText) {
            const lines = rawText.split(/\n+/).filter(line => line.trim());
            const excerpts = [];
            let currentSpeaker = null;
            let currentText = [];

            for (const line of lines) {
                const detected = detectSpeaker(line);

                if (detected.speakerType !== 'unknown' && detected.speakerLabel) {
                    // New speaker detected - save previous block
                    if (currentText.length > 0 && currentSpeaker) {
                        const text = currentText.join(' ').trim();
                        if (text) {
                            const sentences = parseSentences(text);
                            for (const sentence of sentences) {
                                excerpts.push({
                                    ...currentSpeaker,
                                    text: sentence
                                });
                            }
                        }
                    }

                    currentSpeaker = {
                        speakerType: detected.speakerType,
                        speakerLabel: detected.speakerLabel,
                        isTaggable: detected.isTaggable
                    };
                    currentText = detected.text ? [detected.text] : [];
                } else {
                    // Continue with current speaker or unknown
                    if (!currentSpeaker) {
                        currentSpeaker = {
                            speakerType: 'unknown',
                            speakerLabel: '',
                            isTaggable: true
                        };
                    }
                    currentText.push(detected.text);
                }
            }

            // Don't forget the last block
            if (currentText.length > 0 && currentSpeaker) {
                const text = currentText.join(' ').trim();
                if (text) {
                    const sentences = parseSentences(text);
                    for (const sentence of sentences) {
                        excerpts.push({
                            ...currentSpeaker,
                            text: sentence
                        });
                    }
                }
            }

            return excerpts;
        }

        let selectedParseFormat = 'auto';

        function selectParseFormat(format) {
            selectedParseFormat = format;
            document.querySelectorAll('.parse-format-option').forEach(opt => {
                opt.classList.toggle('selected', opt.querySelector('input').value === format);
            });
        }

        // ==========================================
        // VIEW SWITCHING
        // ==========================================

        function switchView(viewName) {
            // Update tabs
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.view === viewName);
            });

            // Update views
            document.querySelectorAll('.view').forEach(view => {
                view.classList.remove('active');
            });

            if (viewName === 'transcripts') {
                document.getElementById('transcripts-view').classList.add('active');
                renderTranscriptList();
            } else if (viewName === 'database') {
                document.getElementById('database-view').classList.add('active');
                renderDatabaseView();
            } else if (viewName === 'tags') {
                document.getElementById('tags-view').classList.add('active');
                renderTagsView();
            } else if (viewName === 'coding') {
                document.getElementById('coding-view').classList.add('active');
            }
        }

        // ==========================================
        // TRANSCRIPT LIST
        // ==========================================

        function renderTranscriptList() {
            const transcripts = [...data.transcripts].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            const container = document.getElementById('transcript-list');

            if (transcripts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No transcripts yet</h3>
                        <p>Click "New Transcript" to import your first user testing transcript.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = transcripts.map(t => {
                const transcriptExcerpts = data.excerpts.filter(e => e.transcriptId === t.id);
                const taggedCount = transcriptExcerpts.filter(e => e.tagIds && e.tagIds.length > 0).length;
                const totalCount = transcriptExcerpts.length;
                const date = new Date(t.createdAt).toLocaleDateString();

                return `
                    <div class="card" onclick="openTranscript('${t.id}')">
                        <div class="card-title">${escapeHtml(t.title)}</div>
                        <div class="card-meta">
                            ${escapeHtml(t.userLabel)} • ${taggedCount}/${totalCount} sentences tagged • Imported ${date}
                        </div>
                        <div class="card-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-secondary btn-small" onclick="deleteTranscript('${t.id}')">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // NEW TRANSCRIPT MODAL
        // ==========================================

        function openNewTranscriptModal() {
            document.getElementById('new-transcript-modal').classList.add('active');
            document.getElementById('transcript-title').focus();
        }

        function closeNewTranscriptModal() {
            document.getElementById('new-transcript-modal').classList.remove('active');
            document.getElementById('transcript-title').value = '';
            document.getElementById('transcript-user').value = '';
            document.getElementById('transcript-text').value = '';
        }

        function createTranscript() {
            const title = document.getElementById('transcript-title').value.trim();
            const userLabel = document.getElementById('transcript-user').value.trim();
            const rawText = document.getElementById('transcript-text').value.trim();

            if (!title) {
                showToast('Please enter a title', 'error');
                return;
            }

            if (!rawText) {
                showToast('Please paste transcript text', 'error');
                return;
            }

            const transcript = {
                id: generateId(),
                title,
                userLabel: userLabel || 'Unknown User',
                rawText,
                parseFormat: selectedParseFormat,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            data.transcripts.push(transcript);

            // Parse based on selected format
            let excerptCount = 0;
            if (selectedParseFormat === 'auto') {
                // Use speaker detection
                const parsedExcerpts = parseTranscriptWithSpeakers(rawText);
                for (let i = 0; i < parsedExcerpts.length; i++) {
                    const parsed = parsedExcerpts[i];
                    const excerpt = {
                        id: generateId(),
                        transcriptId: transcript.id,
                        text: parsed.text,
                        index: i,
                        tagIds: [],
                        speakerType: parsed.speakerType,
                        speakerLabel: parsed.speakerLabel,
                        isTaggable: parsed.isTaggable,
                        createdAt: new Date().toISOString()
                    };
                    data.excerpts.push(excerpt);
                }
                excerptCount = parsedExcerpts.length;
            } else {
                // Raw mode - just split by sentences
                const sentences = parseSentences(rawText);
                for (let i = 0; i < sentences.length; i++) {
                    const excerpt = {
                        id: generateId(),
                        transcriptId: transcript.id,
                        text: sentences[i],
                        index: i,
                        tagIds: [],
                        speakerType: 'unknown',
                        speakerLabel: '',
                        isTaggable: true,
                        createdAt: new Date().toISOString()
                    };
                    data.excerpts.push(excerpt);
                }
                excerptCount = sentences.length;
            }

            saveData();
            closeNewTranscriptModal();

            // Reset parse format to default
            selectedParseFormat = 'auto';
            document.querySelectorAll('.parse-format-option').forEach(opt => {
                opt.classList.toggle('selected', opt.querySelector('input').value === 'auto');
            });

            showToast(`Imported ${excerptCount} sentences`);
            openTranscript(transcript.id);
        }

        // ==========================================
        // CODING VIEW
        // ==========================================

        function openTranscript(transcriptId) {
            currentTranscript = data.transcripts.find(t => t.id === transcriptId);

            document.getElementById('coding-transcript-title').textContent = currentTranscript.title;
            document.getElementById('coding-transcript-meta').textContent = currentTranscript.userLabel;

            // Hide nav tabs, show coding view
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('coding-view').classList.add('active');

            renderSentenceList();
        }

        function backToList() {
            currentTranscript = null;
            selectedExcerptId = null;
            mergeMode = false;
            selectedForMerge.clear();
            switchView('transcripts');
        }

        function renderSentenceList() {
            const excerpts = data.excerpts
                .filter(e => e.transcriptId === currentTranscript.id)
                .sort((a, b) => a.index - b.index);
            const tags = data.tags;

            const container = document.getElementById('sentence-list');

            // Toggle merge-mode class on container
            container.classList.toggle('merge-mode', mergeMode);

            container.innerHTML = excerpts.map(excerpt => {
                const excerptTags = tags.filter(t => excerpt.tagIds && excerpt.tagIds.includes(t.id));
                const isSelected = selectedExcerptId === excerpt.id;
                const isTagged = excerpt.tagIds && excerpt.tagIds.length > 0;
                const speakerType = excerpt.speakerType || 'unknown';
                const speakerLabel = excerpt.speakerLabel || '';
                const isTaggable = excerpt.isTaggable !== false;
                const isSelectedForMerge = selectedForMerge.has(excerpt.id);

                return `
                    <div class="sentence-item ${isSelected ? 'selected' : ''} ${isTagged ? 'tagged' : ''} ${!isTaggable ? 'non-taggable' : ''} ${isSelectedForMerge ? 'multi-selected' : ''}"
                         data-excerpt-id="${excerpt.id}"
                         data-speaker="${speakerType}"
                         onclick="${mergeMode && isTaggable ? `toggleMergeSelect('${excerpt.id}', event)` : (isTaggable ? `selectExcerpt('${excerpt.id}', event)` : '')}">
                        ${isTaggable ? `<input type="checkbox" class="select-checkbox" ${isSelectedForMerge ? 'checked' : ''} onclick="toggleMergeSelect('${excerpt.id}', event)">` : ''}
                        <div class="sentence-number">${excerpt.index + 1}</div>
                        <div class="sentence-content">
                            <div class="sentence-text">${escapeHtml(excerpt.text)}</div>
                            ${isTaggable ? `
                            <div class="sentence-tags">
                                ${excerptTags.map(tag => `
                                    <span class="tag">
                                        ${escapeHtml(tag.name)}
                                        <button class="tag-remove" onclick="removeTagFromExcerpt('${excerpt.id}', '${tag.id}', event)">&times;</button>
                                    </span>
                                `).join('')}
                            </div>
                            ` : ''}
                        </div>
                        ${speakerLabel ? `<span class="speaker-badge speaker-badge--${speakerType}">${escapeHtml(speakerLabel)}</span>` : ''}
                        ${isSelected && isTaggable && !mergeMode ? renderTagPopover(excerpt) : ''}
                    </div>
                `;
            }).join('');

            // Update merge toolbar
            updateMergeToolbar();
        }

        function selectExcerpt(excerptId, event) {
            if (event.target.closest('.tag-popover') || event.target.closest('.tag-remove')) {
                return;
            }

            if (selectedExcerptId === excerptId) {
                selectedExcerptId = null;
            } else {
                selectedExcerptId = excerptId;
            }

            renderSentenceList();

            // Focus search input if popover is open
            if (selectedExcerptId) {
                const searchInput = document.getElementById('tag-search-input');
                if (searchInput) {
                    setTimeout(() => searchInput.focus(), 50);
                }
            }
        }

        function renderTagPopover(excerpt) {
            const tags = [...data.tags].sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));

            return `
                <div class="tag-popover active" onclick="event.stopPropagation()">
                    <input type="text"
                           class="tag-search"
                           id="tag-search-input"
                           placeholder="Search or create tag..."
                           oninput="filterTagOptions(this.value)"
                           onkeydown="handleTagSearchKeydown(event, '${excerpt.id}')">
                    <div id="tag-options-container">
                        ${renderTagOptions(tags, excerpt.tagIds || [], '')}
                    </div>
                </div>
            `;
        }

        function renderTagOptions(tags, selectedTagIds, searchQuery) {
            const query = searchQuery.toLowerCase().trim();
            const filteredTags = query
                ? tags.filter(t => t.name.toLowerCase().includes(query))
                : tags;

            const exactMatch = tags.some(t => t.name.toLowerCase() === query);

            let html = '';

            if (filteredTags.length > 0) {
                html += `<div class="tag-section">
                    <div class="tag-section-title">${query ? 'Matching Tags' : 'All Tags'}</div>
                    ${filteredTags.map(tag => `
                        <label class="tag-option" onclick="toggleTag('${tag.id}', event)">
                            <input type="checkbox" ${selectedTagIds.includes(tag.id) ? 'checked' : ''}>
                            <div class="tag-option-wrapper">
                                <span class="tag-option-name">${escapeHtml(tag.name)}</span>
                                ${tag.description ? `<span class="tag-option-desc">${escapeHtml(tag.description)}</span>` : ''}
                            </div>
                            <span class="tag-option-count">${tag.usageCount || 0}</span>
                        </label>
                    `).join('')}
                </div>`;
            }

            if (query && !exactMatch) {
                html += `<button class="tag-create-btn" onclick="createAndApplyTag('${escapeHtml(query)}')">
                    + Create "${escapeHtml(query)}"
                </button>`;
            }

            if (!query && tags.length === 0) {
                html += `<div class="tag-section">
                    <p style="color: var(--text-muted); font-size: 0.85rem; padding: 8px;">
                        No tags yet. Type to create your first tag.
                    </p>
                </div>`;
            }

            return html;
        }

        function filterTagOptions(query) {
            const tags = [...data.tags].sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
            const excerpt = data.excerpts.find(e => e.id === selectedExcerptId);

            const container = document.getElementById('tag-options-container');
            container.innerHTML = renderTagOptions(tags, excerpt?.tagIds || [], query);
        }

        function handleTagSearchKeydown(event, excerptId) {
            if (event.key === 'Enter') {
                const query = event.target.value.trim().toLowerCase();
                if (!query) return;

                const exactMatch = data.tags.find(t => t.name.toLowerCase() === query);

                if (exactMatch) {
                    toggleTag(exactMatch.id, event);
                } else {
                    createAndApplyTag(query);
                }
            } else if (event.key === 'Escape') {
                selectedExcerptId = null;
                renderSentenceList();
            }
        }

        function toggleTag(tagId, event) {
            if (event) event.stopPropagation();

            const excerpt = data.excerpts.find(e => e.id === selectedExcerptId);
            const tag = data.tags.find(t => t.id === tagId);

            if (!excerpt.tagIds) excerpt.tagIds = [];

            const index = excerpt.tagIds.indexOf(tagId);
            if (index === -1) {
                // Add tag
                excerpt.tagIds.push(tagId);
                tag.usageCount = (tag.usageCount || 0) + 1;
            } else {
                // Remove tag
                excerpt.tagIds.splice(index, 1);
                tag.usageCount = Math.max(0, (tag.usageCount || 1) - 1);
            }

            saveData();
            renderSentenceList();

            // Refocus search input
            setTimeout(() => {
                const searchInput = document.getElementById('tag-search-input');
                if (searchInput) searchInput.focus();
            }, 50);
        }

        function createAndApplyTag(name) {
            const normalizedName = name.toLowerCase().trim();

            // Check if tag already exists
            let tag = data.tags.find(t => t.name.toLowerCase() === normalizedName);

            if (!tag) {
                tag = {
                    id: generateId(),
                    name: normalizedName,
                    description: '',
                    usageCount: 0,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                data.tags.push(tag);
            }

            // Apply to current excerpt
            const excerpt = data.excerpts.find(e => e.id === selectedExcerptId);
            if (!excerpt.tagIds) excerpt.tagIds = [];

            if (!excerpt.tagIds.includes(tag.id)) {
                excerpt.tagIds.push(tag.id);
                tag.usageCount = (tag.usageCount || 0) + 1;
            }

            saveData();
            renderSentenceList();
            showToast(`Created and applied tag "${normalizedName}"`);
        }

        function removeTagFromExcerpt(excerptId, tagId, event) {
            event.stopPropagation();

            const excerpt = data.excerpts.find(e => e.id === excerptId);
            const tag = data.tags.find(t => t.id === tagId);

            excerpt.tagIds = excerpt.tagIds.filter(id => id !== tagId);
            tag.usageCount = Math.max(0, (tag.usageCount || 1) - 1);

            saveData();
            renderSentenceList();
        }

        // ==========================================
        // MERGE SENTENCES
        // ==========================================

        function toggleMergeMode() {
            mergeMode = !mergeMode;
            selectedForMerge.clear();
            selectedExcerptId = null;

            const btn = document.getElementById('merge-mode-btn');
            btn.classList.toggle('btn-primary', mergeMode);
            btn.classList.toggle('btn-secondary', !mergeMode);
            btn.textContent = mergeMode ? 'Exit Merge Mode' : 'Merge Mode';

            renderSentenceList();
        }

        function toggleMergeSelect(excerptId, event) {
            event.stopPropagation();

            if (selectedForMerge.has(excerptId)) {
                selectedForMerge.delete(excerptId);
            } else {
                selectedForMerge.add(excerptId);
            }

            renderSentenceList();
        }

        function updateMergeToolbar() {
            const toolbar = document.getElementById('merge-toolbar');
            const countEl = document.getElementById('merge-count');

            if (mergeMode && selectedForMerge.size > 0) {
                toolbar.classList.add('active');
                countEl.textContent = selectedForMerge.size;
            } else {
                toolbar.classList.remove('active');
            }
        }

        function clearMergeSelection() {
            selectedForMerge.clear();
            renderSentenceList();
        }

        function mergeSelectedSentences() {
            if (selectedForMerge.size < 2) {
                showToast('Select at least 2 sentences to merge', 'error');
                return;
            }

            // Get selected excerpts sorted by index
            const selectedExcerpts = data.excerpts
                .filter(e => selectedForMerge.has(e.id) && e.transcriptId === currentTranscript.id)
                .sort((a, b) => a.index - b.index);

            if (selectedExcerpts.length < 2) {
                showToast('Select at least 2 sentences to merge', 'error');
                return;
            }

            // Check if they are consecutive
            for (let i = 1; i < selectedExcerpts.length; i++) {
                // Find excerpts between them
                const prevIdx = selectedExcerpts[i - 1].index;
                const currIdx = selectedExcerpts[i].index;
                const between = data.excerpts.filter(e =>
                    e.transcriptId === currentTranscript.id &&
                    e.index > prevIdx &&
                    e.index < currIdx &&
                    e.isTaggable !== false
                );

                if (between.length > 0) {
                    showToast('Can only merge consecutive taggable sentences', 'error');
                    return;
                }
            }

            // Merge: combine text, keep first excerpt's speaker info, merge tags
            const firstExcerpt = selectedExcerpts[0];
            const mergedText = selectedExcerpts.map(e => e.text).join(' ');
            const mergedTags = [...new Set(selectedExcerpts.flatMap(e => e.tagIds || []))];

            // Update first excerpt with merged content
            firstExcerpt.text = mergedText;
            firstExcerpt.tagIds = mergedTags;

            // Remove the other excerpts
            const idsToRemove = selectedExcerpts.slice(1).map(e => e.id);
            data.excerpts = data.excerpts.filter(e => !idsToRemove.includes(e.id));

            // Reindex remaining excerpts for this transcript
            const transcriptExcerpts = data.excerpts
                .filter(e => e.transcriptId === currentTranscript.id)
                .sort((a, b) => a.index - b.index);

            transcriptExcerpts.forEach((e, i) => {
                e.index = i;
            });

            // Clear selection and save
            selectedForMerge.clear();
            saveData();
            renderSentenceList();

            showToast(`Merged ${selectedExcerpts.length} sentences`);
        }

        // ==========================================
        // DATABASE VIEW
        // ==========================================

        function renderDatabaseView() {
            const tags = [...data.tags].sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));

            // Update filter dropdown
            const filterSelect = document.getElementById('tag-filter');
            filterSelect.innerHTML = `
                <option value="">All tagged excerpts</option>
                ${tags.map(t => `<option value="${t.id}">${escapeHtml(t.name)} (${t.usageCount || 0})</option>`).join('')}
            `;

            filterByTag();
        }

        function filterByTag() {
            const selectedTagId = document.getElementById('tag-filter').value;

            // Filter excerpts that have at least one tag
            let filtered = data.excerpts.filter(e => e.tagIds && e.tagIds.length > 0);

            // Further filter by selected tag
            if (selectedTagId) {
                filtered = filtered.filter(e => e.tagIds.includes(selectedTagId));
            }

            // Sort by transcript, then by index
            filtered.sort((a, b) => {
                if (a.transcriptId !== b.transcriptId) {
                    return a.transcriptId.localeCompare(b.transcriptId);
                }
                return a.index - b.index;
            });

            const container = document.getElementById('excerpts-list');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No tagged excerpts</h3>
                        <p>Start coding your transcripts to see excerpts here.</p>
                    </div>
                `;
                document.getElementById('results-count').textContent = '';
                return;
            }

            container.innerHTML = filtered.map(excerpt => {
                const transcript = data.transcripts.find(t => t.id === excerpt.transcriptId);
                const excerptTags = data.tags.filter(t => excerpt.tagIds.includes(t.id));

                return `
                    <div class="excerpt-card">
                        <div class="excerpt-text">"${escapeHtml(excerpt.text)}"</div>
                        <div class="excerpt-meta">
                            <span class="excerpt-source">${escapeHtml(transcript?.title || 'Unknown')} • ${escapeHtml(transcript?.userLabel || '')}</span>
                            <div class="excerpt-tags">
                                ${excerptTags.map(t => `<span class="tag">${escapeHtml(t.name)}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const selectedTag = data.tags.find(t => t.id === selectedTagId);
            document.getElementById('results-count').textContent =
                `Showing ${filtered.length} excerpt${filtered.length !== 1 ? 's' : ''}${selectedTag ? ` with tag "${selectedTag.name}"` : ''}`;

            // Show/hide export one-pager button
            const exportBtn = document.getElementById('export-onepager-btn');
            if (selectedTagId && filtered.length > 0) {
                exportBtn.style.display = 'block';
            } else {
                exportBtn.style.display = 'none';
            }
        }

        // ==========================================
        // TAGS VIEW
        // ==========================================

        let editingTagId = null;

        function renderTagsView() {
            const tags = [...data.tags].sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));

            const container = document.getElementById('tags-list');

            if (tags.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No tags yet</h3>
                        <p>Tags will appear here after you create them while coding transcripts.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = tags.map(tag => {
                const isEditing = editingTagId === tag.id;

                return `
                    <div class="tag-card" data-tag-id="${tag.id}">
                        <div class="tag-card-header">
                            <span class="tag-card-name">${escapeHtml(tag.name)}</span>
                            <span class="tag-card-count">${tag.usageCount || 0} uses</span>
                        </div>
                        ${isEditing ? `
                            <textarea class="tag-description-input"
                                      id="tag-desc-input-${tag.id}"
                                      placeholder="Describe this theme (2-4 sentences)..."
                                      onkeydown="handleDescriptionKeydown(event, '${tag.id}')">${escapeHtml(tag.description || '')}</textarea>
                            <div class="tag-card-actions">
                                <button class="btn btn-primary btn-small" onclick="saveTagDescription('${tag.id}')">Save</button>
                                <button class="btn btn-secondary btn-small" onclick="cancelEditDescription()">Cancel</button>
                            </div>
                        ` : `
                            <div class="tag-card-description ${tag.description ? '' : 'empty'}">
                                ${tag.description ? escapeHtml(tag.description) : 'No description yet. Click "Edit Description" to add one.'}
                            </div>
                            <div class="tag-card-actions">
                                <button class="btn btn-secondary btn-small" onclick="editTagDescription('${tag.id}')">${tag.description ? 'Edit' : 'Add'} Description</button>
                                <button class="btn btn-secondary btn-small" onclick="exportOnePagerForTag('${tag.id}')">Export One-Pager</button>
                                ${(tag.usageCount || 0) === 0 ? `<button class="btn btn-danger btn-small" onclick="deleteTag('${tag.id}')">Delete</button>` : ''}
                            </div>
                        `}
                    </div>
                `;
            }).join('');

            // Focus textarea if editing
            if (editingTagId) {
                const input = document.getElementById(`tag-desc-input-${editingTagId}`);
                if (input) {
                    setTimeout(() => input.focus(), 50);
                }
            }
        }

        function editTagDescription(tagId) {
            editingTagId = tagId;
            renderTagsView();
        }

        function cancelEditDescription() {
            editingTagId = null;
            renderTagsView();
        }

        function saveTagDescription(tagId) {
            const input = document.getElementById(`tag-desc-input-${tagId}`);
            if (!input) return;

            const tag = data.tags.find(t => t.id === tagId);
            if (!tag) return;

            tag.description = input.value.trim();
            tag.updatedAt = new Date().toISOString();

            saveData();
            editingTagId = null;
            renderTagsView();
            showToast('Description saved');
        }

        function handleDescriptionKeydown(event, tagId) {
            if (event.key === 'Escape') {
                cancelEditDescription();
            } else if (event.key === 'Enter' && event.ctrlKey) {
                saveTagDescription(tagId);
            }
        }

        function deleteTag(tagId) {
            const tag = data.tags.find(t => t.id === tagId);
            if (!tag) return;

            pendingConfirmAction = () => {
                data.tags = data.tags.filter(t => t.id !== tagId);
                saveData();
                showToast(`Tag "${tag.name}" deleted`);
                renderTagsView();
            };

            document.getElementById('confirm-title').textContent = 'Delete Tag';
            document.getElementById('confirm-message').textContent = `Are you sure you want to delete the tag "${tag.name}"?`;
            document.getElementById('confirm-modal').classList.add('active');
        }

        // ==========================================
        // EXPORT ONE-PAGER
        // ==========================================

        let exportingTagId = null;

        function exportOnePager() {
            const selectedTagId = document.getElementById('tag-filter').value;
            if (!selectedTagId) return;
            showExportModal(selectedTagId);
        }

        function exportOnePagerForTag(tagId) {
            showExportModal(tagId);
        }

        function showExportModal(tagId) {
            const tag = data.tags.find(t => t.id === tagId);
            if (!tag) return;

            exportingTagId = tagId;
            document.getElementById('export-modal-title').textContent = `Export: "${tag.name}"`;
            document.getElementById('export-modal').classList.add('active');
        }

        function closeExportModal() {
            document.getElementById('export-modal').classList.remove('active');
            exportingTagId = null;
        }

        function executeExport() {
            if (!exportingTagId) return;

            const options = {
                includeDescription: document.getElementById('export-opt-description').checked,
                showParticipant: document.getElementById('export-opt-participant').checked,
                includeSummary: document.getElementById('export-opt-summary').checked,
                showSource: document.getElementById('export-opt-source').checked
            };

            generateOnePagerHTML(exportingTagId, options);
            closeExportModal();
        }

        function generateOnePagerHTML(tagId, options) {
            const tag = data.tags.find(t => t.id === tagId);
            if (!tag) return;

            const excerpts = data.excerpts.filter(e => e.tagIds && e.tagIds.includes(tagId));
            const transcriptIds = [...new Set(excerpts.map(e => e.transcriptId))];

            // Group excerpts by transcript
            const groupedExcerpts = excerpts.map(excerpt => {
                const transcript = data.transcripts.find(t => t.id === excerpt.transcriptId);
                return {
                    ...excerpt,
                    transcriptTitle: transcript?.title || 'Unknown',
                    userLabel: transcript?.userLabel || 'Unknown'
                };
            }).sort((a, b) => {
                if (a.transcriptId !== b.transcriptId) {
                    return a.transcriptId.localeCompare(b.transcriptId);
                }
                return a.index - b.index;
            });

            const participantCount = transcriptIds.length;
            const excerptCount = excerpts.length;

            const html = `<!DOCTYPE html>
<html>
<head>
    <title>Theme Report: ${escapeHtml(tag.name)}</title>
    <style>
        @page { margin: 1in; size: letter; }
        body {
            font-family: 'Georgia', serif;
            max-width: 7in;
            margin: 0 auto;
            padding: 40px;
            color: #1a1a2e;
            line-height: 1.6;
        }
        .report-header {
            border-bottom: 3px solid #6366f1;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .theme-name {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a2e;
            margin: 0 0 10px 0;
        }
        .description {
            font-size: 16px;
            font-style: italic;
            color: #4a5568;
            margin: 20px 0;
            padding: 15px;
            background: #f7fafc;
            border-left: 4px solid #6366f1;
        }
        .summary {
            font-size: 14px;
            color: #718096;
            margin-bottom: 30px;
        }
        .excerpt-card {
            margin: 20px 0;
            padding: 20px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            page-break-inside: avoid;
        }
        .participant-badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .excerpt-text {
            font-size: 16px;
            margin: 10px 0;
        }
        .excerpt-source {
            font-size: 13px;
            color: #718096;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #a0aec0;
            text-align: center;
        }
        @media print {
            body { padding: 0; }
            .excerpt-card { box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="report-header">
        <h1 class="theme-name">${escapeHtml(tag.name)}</h1>
    </div>

    ${options.includeDescription && tag.description ? `<div class="description">${escapeHtml(tag.description)}</div>` : ''}

    ${options.includeSummary ? `<div class="summary">
        <strong>${excerptCount} excerpt${excerptCount !== 1 ? 's' : ''}</strong> from
        <strong>${participantCount} participant${participantCount !== 1 ? 's' : ''}</strong>
    </div>` : ''}

    <div class="excerpts">
        ${groupedExcerpts.map(excerpt => `
            <div class="excerpt-card">
                ${options.showParticipant ? `<span class="participant-badge">${escapeHtml(excerpt.userLabel)}</span>` : ''}
                <p class="excerpt-text">"${escapeHtml(excerpt.text)}"</p>
                ${options.showSource ? `<div class="excerpt-source">
                    Source: ${escapeHtml(excerpt.transcriptTitle)} (Sentence #${excerpt.index + 1})
                </div>` : ''}
            </div>
        `).join('')}
    </div>

    <div class="footer">
        Generated by QualCoder | ${new Date().toLocaleDateString()}
    </div>
</body>
</html>`;

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `${tag.name.replace(/[^a-z0-9]/gi, '-')}-one-pager.html`;
            a.click();

            URL.revokeObjectURL(url);
            showToast('One-pager exported');
        }

        // ==========================================
        // DELETE TRANSCRIPT
        // ==========================================

        function deleteTranscript(transcriptId) {
            pendingConfirmAction = () => {
                // Delete all excerpts for this transcript
                const transcriptExcerpts = data.excerpts.filter(e => e.transcriptId === transcriptId);
                for (const excerpt of transcriptExcerpts) {
                    // Update tag usage counts
                    if (excerpt.tagIds) {
                        for (const tagId of excerpt.tagIds) {
                            const tag = data.tags.find(t => t.id === tagId);
                            if (tag) {
                                tag.usageCount = Math.max(0, (tag.usageCount || 1) - 1);
                            }
                        }
                    }
                }

                // Remove excerpts for this transcript
                data.excerpts = data.excerpts.filter(e => e.transcriptId !== transcriptId);

                // Delete transcript
                data.transcripts = data.transcripts.filter(t => t.id !== transcriptId);

                saveData();
                showToast('Transcript deleted');
                renderTranscriptList();
            };

            document.getElementById('confirm-title').textContent = 'Delete Transcript';
            document.getElementById('confirm-message').textContent = 'Are you sure you want to delete this transcript and all its coded excerpts? This cannot be undone.';
            document.getElementById('confirm-modal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('active');
            pendingConfirmAction = null;
        }

        function confirmAction() {
            if (pendingConfirmAction) {
                pendingConfirmAction();
            }
            closeConfirmModal();
        }

        // ==========================================
        // EXPORT / IMPORT
        // ==========================================

        function exportData() {
            const exportPayload = {
                version: 1,
                exportedAt: new Date().toISOString(),
                transcripts: data.transcripts,
                excerpts: data.excerpts,
                tags: data.tags
            };

            const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `qualcoder-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();

            URL.revokeObjectURL(url);
            showToast('Data exported successfully');
        }

        function exportTranscript() {
            if (!currentTranscript) return;

            const transcriptExcerpts = data.excerpts
                .filter(e => e.transcriptId === currentTranscript.id)
                .sort((a, b) => a.index - b.index);

            const exportPayload = {
                version: 1,
                exportedAt: new Date().toISOString(),
                transcript: currentTranscript,
                excerpts: transcriptExcerpts.map(e => ({
                    ...e,
                    tags: (e.tagIds || []).map(tagId => {
                        const tag = data.tags.find(t => t.id === tagId);
                        return tag ? tag.name : null;
                    }).filter(Boolean)
                }))
            };

            const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentTranscript.title.replace(/[^a-z0-9]/gi, '-')}-coded.json`;
            a.click();

            URL.revokeObjectURL(url);
            showToast('Transcript exported');
        }

        function importData() {
            document.getElementById('import-file').click();
        }

        function handleImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);

                    if (!importedData.version || !importedData.transcripts || !importedData.excerpts || !importedData.tags) {
                        throw new Error('Invalid backup file format');
                    }

                    // Merge imported data with existing data
                    for (const tag of importedData.tags) {
                        const existing = data.tags.find(t => t.id === tag.id);
                        if (!existing) {
                            data.tags.push(tag);
                        }
                    }

                    for (const transcript of importedData.transcripts) {
                        const existing = data.transcripts.find(t => t.id === transcript.id);
                        if (!existing) {
                            data.transcripts.push(transcript);
                        }
                    }

                    for (const excerpt of importedData.excerpts) {
                        const existing = data.excerpts.find(e => e.id === excerpt.id);
                        if (!existing) {
                            data.excerpts.push(excerpt);
                        }
                    }

                    saveData();
                    showToast(`Imported ${importedData.transcripts.length} transcripts`);
                    renderTranscriptList();

                } catch (err) {
                    showToast('Failed to import: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);

            // Reset file input
            event.target.value = '';
        }

        // ==========================================
        // UTILITIES
        // ==========================================

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast active' + (type === 'error' ? ' error' : '');

            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Close popover when clicking outside
        document.addEventListener('click', (event) => {
            if (selectedExcerptId && !event.target.closest('.sentence-item')) {
                selectedExcerptId = null;
                if (currentTranscript) {
                    renderSentenceList();
                }
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                if (document.getElementById('new-transcript-modal').classList.contains('active')) {
                    closeNewTranscriptModal();
                } else if (document.getElementById('confirm-modal').classList.contains('active')) {
                    closeConfirmModal();
                } else if (document.getElementById('export-modal').classList.contains('active')) {
                    closeExportModal();
                } else if (selectedExcerptId) {
                    selectedExcerptId = null;
                    renderSentenceList();
                }
            }
        });

        // ==========================================
        // INITIALIZATION
        // ==========================================

        function init() {
            loadData();
            renderTranscriptList();
        }

        init();
    </script>
</body>
</html>
