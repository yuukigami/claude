<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualitative Research Coder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f0f1a;
            --bg-card: #232342;
            --bg-hover: #2a2a4a;
            --bg-selected: #3d3d6b;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7b;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-muted: #4f46e5;
            --border: #3d3d5c;
            --border-light: #4d4d6c;
            --tag-bg: #4338ca;
            --tag-text: #e0e7ff;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Layout */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo span {
            color: var(--accent);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .nav-tab {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .nav-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--text-primary);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--text-primary);
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: var(--border-light);
            background: var(--bg-hover);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        /* Views */
        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Transcript List */
        .transcript-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .transcript-list-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-textarea {
            min-height: 200px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        /* Coding View */
        .coding-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .coding-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
        }

        .back-btn:hover {
            color: var(--text-primary);
        }

        .coding-title h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .coding-title .meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Sentence List */
        .sentence-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sentence-item {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .sentence-item:hover {
            border-color: var(--border-light);
        }

        .sentence-item.selected {
            background: var(--bg-selected);
            border-color: var(--accent);
        }

        .sentence-item.tagged {
            border-left: 3px solid var(--accent);
        }

        .sentence-number {
            font-size: 0.8rem;
            color: var(--text-muted);
            min-width: 24px;
            padding-top: 2px;
        }

        .sentence-content {
            flex: 1;
        }

        .sentence-text {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .sentence-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* Tags */
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tag-remove {
            background: none;
            border: none;
            color: var(--tag-text);
            opacity: 0.7;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            padding: 0;
            margin-left: 2px;
        }

        .tag-remove:hover {
            opacity: 1;
        }

        /* Tag Popover */
        .tag-popover {
            position: absolute;
            top: 100%;
            left: 40px;
            width: 280px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: none;
        }

        .tag-popover.active {
            display: block;
        }

        .tag-search {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            margin-bottom: 12px;
        }

        .tag-search:focus {
            outline: none;
            border-color: var(--accent);
        }

        .tag-section {
            margin-bottom: 12px;
        }

        .tag-section-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .tag-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .tag-option:hover {
            background: var(--bg-hover);
        }

        .tag-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        .tag-option-name {
            font-size: 0.9rem;
            flex: 1;
        }

        .tag-option-count {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .tag-create-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent-muted);
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
        }

        .tag-create-btn:hover {
            background: var(--accent);
        }

        /* Database View */
        .database-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .database-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filter-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .filter-select {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            min-width: 200px;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .excerpt-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }

        .excerpt-text {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 12px;
            font-style: italic;
        }

        .excerpt-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .excerpt-source {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .excerpt-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .results-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 16px;
        }

        /* Header Actions */
        .header-actions {
            display: flex;
            gap: 8px;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            background: var(--success);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
        }

        .toast.active {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            background: var(--danger);
        }

        /* Confirmation Modal */
        .confirm-modal .modal {
            max-width: 400px;
        }

        .confirm-modal p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* Tags Management View */
        .tags-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tags-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .tag-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }

        .tag-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .tag-card-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .tag-card-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .tag-card-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
            font-style: italic;
        }

        .tag-card-description.empty {
            color: var(--text-muted);
            font-style: normal;
        }

        .tag-card-actions {
            display: flex;
            gap: 8px;
        }

        .tag-description-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            margin-bottom: 8px;
        }

        .tag-description-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Tag option with description preview */
        .tag-option-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .tag-option-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        /* Export One-Pager Button */
        .export-onepager-btn {
            margin-left: auto;
        }

        /* Export Options Dialog */
        .export-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .export-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .export-option:hover {
            background: var(--bg-hover);
        }

        .export-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .export-option span {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        /* Speaker Type Styles */
        .sentence-item[data-speaker="task"] {
            background: rgba(245, 158, 11, 0.15);
            border-left: 4px solid #f59e0b;
        }

        .sentence-item[data-speaker="task"]:hover {
            background: rgba(245, 158, 11, 0.25);
        }

        .sentence-item[data-speaker="question"] {
            background: rgba(59, 130, 246, 0.15);
            border-left: 4px solid #3b82f6;
        }

        .sentence-item[data-speaker="question"]:hover {
            background: rgba(59, 130, 246, 0.25);
        }

        .sentence-item[data-speaker="participant"] {
            border-left: 4px solid #10b981;
        }

        .sentence-item[data-speaker="moderator"] {
            background: rgba(139, 92, 246, 0.15);
            border-left: 4px solid #8b5cf6;
        }

        .sentence-item[data-speaker="moderator"]:hover {
            background: rgba(139, 92, 246, 0.25);
        }

        .speaker-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg-tertiary);
            color: var(--text-muted);
        }

        .speaker-badge--task {
            background: rgba(245, 158, 11, 0.3);
            color: #f59e0b;
        }

        .speaker-badge--question {
            background: rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }

        .speaker-badge--participant {
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .speaker-badge--moderator {
            background: rgba(139, 92, 246, 0.3);
            color: #8b5cf6;
        }

        .sentence-item.non-taggable {
            opacity: 0.7;
            cursor: default;
        }

        .sentence-item.non-taggable:hover {
            border-color: var(--border);
        }

        /* Multi-select for merging */
        .sentence-item.multi-selected {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--accent);
        }

        .sentence-item .select-checkbox {
            position: absolute;
            top: 12px;
            left: -28px;
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .sentence-list.merge-mode .sentence-item .select-checkbox {
            opacity: 1;
        }

        .sentence-item:hover .select-checkbox {
            opacity: 0.7;
        }

        .sentence-item.multi-selected .select-checkbox {
            opacity: 1;
        }

        /* Merge toolbar */
        .merge-toolbar {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--accent);
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .merge-toolbar.active {
            display: flex;
        }

        .merge-toolbar-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .merge-toolbar-text strong {
            color: var(--text-primary);
        }

        /* Parse Format Selector */
        .parse-format-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .parse-format-option {
            flex: 1;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .parse-format-option:hover {
            border-color: var(--border-light);
        }

        .parse-format-option.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .parse-format-option input {
            display: none;
        }

        .parse-format-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            display: block;
            margin-bottom: 2px;
        }

        .parse-format-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">Qual<span>Coder</span></div>
            <div class="header-actions">
                <button class="btn btn-secondary btn-small" onclick="exportData()">Export</button>
                <button class="btn btn-secondary btn-small" onclick="importData()">Import</button>
            </div>
        </header>

        <nav class="nav-tabs">
            <button class="nav-tab active" data-view="transcripts" onclick="switchView('transcripts')">Transcripts</button>
            <button class="nav-tab" data-view="database" onclick="switchView('database')">Database</button>
            <button class="nav-tab" data-view="tags" onclick="switchView('tags')">Tags</button>
        </nav>

        <!-- Transcripts View -->
        <div id="transcripts-view" class="view active">
            <div class="transcript-list-header">
                <h2>My Transcripts</h2>
                <button class="btn btn-primary" onclick="openNewTranscriptModal()">+ New Transcript</button>
            </div>
            <div id="transcript-list"></div>
        </div>

        <!-- Coding View -->
        <div id="coding-view" class="view">
            <div class="coding-header">
                <div class="coding-header-left">
                    <button class="back-btn" onclick="backToList()">←</button>
                    <div class="coding-title">
                        <h2 id="coding-transcript-title"></h2>
                        <div class="meta" id="coding-transcript-meta"></div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary btn-small" id="merge-mode-btn" onclick="toggleMergeMode()">Merge Mode</button>
                    <button class="btn btn-secondary btn-small" onclick="exportTranscript()">Export This</button>
                </div>
            </div>
            <div id="merge-toolbar" class="merge-toolbar">
                <span class="merge-toolbar-text"><strong id="merge-count">0</strong> sentences selected</span>
                <button class="btn btn-secondary btn-small" onclick="clearMergeSelection()">Clear</button>
                <button class="btn btn-primary btn-small" onclick="mergeSelectedSentences()">Merge Selected</button>

        <!-- Database View -->
        <div id="database-view" class="view">

                        <span class="parse-format-label">Auto-Detect</span>
                        <span class="parse-format-desc">Detect speakers automatically</span>
                    </label>
                    <label class="parse-format-option" onclick="selectParseFormat('raw')">
                        <input type="radio" name="parse-format" value="raw">
                        <span class="parse-format-label">Raw</span>
